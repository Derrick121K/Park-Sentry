services:
  postgres:
    image: postgres:16-alpine
    container_name: parksentry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: parksentry
      POSTGRES_PASSWORD: parksentry_dev
      POSTGRES_DB: parksentry
    ports:
      # Host 5433 avoids conflict when another Postgres already uses 5432.
      - "5433:5432"
    volumes:
      - parksentry_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parksentry -d parksentry"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  parksentry_pgdata:
